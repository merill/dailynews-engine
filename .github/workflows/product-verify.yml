name: Product site verification

# Reusable: rebuilds a product's committed site from the same inputs and fails
# if any generated page differs. Pagefind re-hashes its index on every run, so
# the index is compared on coverage counts rather than bytes.

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up the dailynews engine
        uses: merill/dailynews-engine/.github/actions/setup@v1.4.1
      - name: Clone the documentation source
        run: dailynews clone-docs
      - name: Clone Message Center repository
        run: git clone --depth 1 https://github.com/merill/mc.git mc
      - name: Record the committed search coverage
        run: |
          node -e "
            const m = require('./website/search-manifest.json');
            const e = require('./website/pagefind/pagefind-entry.json');
            const { generatedAt, ...counts } = m;
            console.log(JSON.stringify({ ...counts, pages: e.languages.en.page_count }));
          " > "$RUNNER_TEMP/committed-coverage.json"
          cat "$RUNNER_TEMP/committed-coverage.json"
      - name: Rebuild the site at the committed generation time
        env:
          MC_DATA_PATH: ./mc/@data
          KIT_DAILY_FORM_UID: ${{ secrets.KIT_DAILY_FORM_UID }}
          KIT_DAILY_FORM_EMBED_SRC: ${{ secrets.KIT_DAILY_FORM_EMBED_SRC }}
          USERJOT_PROJECT_ID: ${{ vars.USERJOT_PROJECT_ID }}
        run: |
          SITE_GENERATED_AT="$(node -p "require('./website/refresh-status.json').lastCheckedAt")"
          echo "Rebuilding as of $SITE_GENERATED_AT"
          SITE_GENERATED_AT="$SITE_GENERATED_AT" dailynews build-site
          SITE_GENERATED_AT="$SITE_GENERATED_AT" dailynews search-index
      - name: Fail when the generated pages changed
        run: |
          if ! git diff --quiet -- website/ ':(exclude)website/pagefind' ':(exclude)website/search-manifest.json'; then
            echo "::error::Rebuilding produced different pages."
            git diff --stat -- website/ ':(exclude)website/pagefind' ':(exclude)website/search-manifest.json'
            exit 1
          fi
          echo "The rebuild reproduced every generated page exactly."
      - name: Fail when the search index no longer covers the same content
        run: |
          node -e "
            const m = require('./website/search-manifest.json');
            const e = require('./website/pagefind/pagefind-entry.json');
            const { generatedAt, ...counts } = m;
            const a = JSON.stringify(require(process.env.RUNNER_TEMP + '/committed-coverage.json'));
            const b = JSON.stringify({ ...counts, pages: e.languages.en.page_count });
            if (a !== b) { console.error('::error::Search coverage changed.\n  committed: ' + a + '\n  rebuilt:   ' + b); process.exit(1); }
            console.log('Search coverage is unchanged: ' + b);
          "
