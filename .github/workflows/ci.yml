name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  # The setup action is what every product repository depends on, so it is
  # exercised here rather than only downstream.
  setup-action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: engine
      - name: Use the action from this checkout
        uses: ./engine/.github/actions/setup
      - name: The dispatcher runs and the package resolves
        run: |
          dailynews --help
          node -e "require('@merill/dailynews-engine/config')"
